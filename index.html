<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Geometry Dash</title>
    <link href="https://fonts.googleapis.com/css2?family=Vibur&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gd-green: #00FF00;
            --gd-blue: #00D0FF;
            --gd-yellow: #FFD700;
            --gd-purple: #BF00FF;
            --gd-red: #FF0000;
            --gd-dark: #1a1a2e;
            --gd-panel: #16213e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #2a2a4e 0%, #000000 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(var(--gd-panel) 1px, transparent 1px),
                linear-gradient(90deg, var(--gd-panel) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            opacity: 0.3;
            z-index: -1;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        .calculator {
            background: rgba(22, 33, 62, 0.9);
            border: 4px solid var(--gd-blue);
            border-radius: 15px;
            padding: 25px;
            width: 380px;
            box-shadow: 0 0 20px var(--gd-blue), inset 0 0 20px rgba(0, 208, 255, 0.2);
            position: relative;
            backdrop-filter: blur(5px);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px var(--gd-blue); }
            50% { box-shadow: 0 0 40px var(--gd-blue); }
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #000;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 2px solid #fff;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gd-green), var(--gd-yellow));
            box-shadow: 0 0 10px var(--gd-green);
            transition: width 0.3s ease;
        }

        .display {
            background: #000;
            border: 3px solid var(--gd-green);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: right;
            box-shadow: 0 0 15px var(--gd-green);
        }

        .previous-operand {
            color: var(--gd-blue);
            font-size: 14px;
            min-height: 20px;
            font-family: 'Vibur', cursive;
        }

        .current-operand {
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            font-family: 'Vibur', cursive;
            text-shadow: 0 0 5px #fff;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.1s ease;
            border: 2px solid rgba(255,255,255,0.2);
        }

        button:active { transform: scale(0.95); }

        .btn-num {
            background: linear-gradient(135deg, #2980b9, #3498db);
            color: white;
            box-shadow: 0 4px 0 #1c5980;
        }

        .btn-op {
            background: linear-gradient(135deg, #8e44ad, #9b59b6);
            color: white;
            box-shadow: 0 4px 0 #5e2d73;
        }

        .btn-action {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            box-shadow: 0 4px 0 #7b241c;
        }

        .btn-equal {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            box-shadow: 0 4px 0 #1e8449;
            grid-column: span 2;
        }

        .btn-num:hover, .btn-op:hover, .btn-action:hover, .btn-equal:hover {
            filter: brightness(1.2);
        }

        .shake { animation: shake 0.5s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .icon {
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 80px;
            opacity: 0.1;
            transform: rotate(15deg);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="calculator" id="calc">
        <div class="icon">👾</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="display">
            <div class="previous-operand" id="previous"></div>
            <div class="current-operand" id="current">0</div>
        </div>

        <div class="buttons">
            <button class="btn-action" onclick="clearAll()">AC</button>
            <button class="btn-action" onclick="deleteLast()">DEL</button>
            <button class="btn-op" onclick="appendOperator('%')">%</button>
            <button class="btn-op" onclick="appendOperator('/')">÷</button>

            <button class="btn-num" onclick="appendNumber('7')">7</button>
            <button class="btn-num" onclick="appendNumber('8')">8</button>
            <button class="btn-num" onclick="appendNumber('9')">9</button>
            <button class="btn-op" onclick="appendOperator('*')">×</button>

            <button class="btn-num" onclick="appendNumber('4')">4</button>
            <button class="btn-num" onclick="appendNumber('5')">5</button>
            <button class="btn-num" onclick="appendNumber('6')">6</button>
            <button class="btn-op" onclick="appendOperator('-')">−</button>

            <button class="btn-num" onclick="appendNumber('1')">1</button>
            <button class="btn-num" onclick="appendNumber('2')">2</button>
            <button class="btn-num" onclick="appendNumber('3')">3</button>
            <button class="btn-op" onclick="appendOperator('+')">+</button>

            <button class="btn-num" style="grid-column: span 2;" onclick="appendNumber('0')">0</button>
            <button class="btn-num" onclick="appendNumber('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;
        let progress = 0;

        function updateDisplay() {
            document.getElementById('current').textContent = currentOperand;
            document.getElementById('previous').textContent = previousOperand;
            let len = (currentOperand + previousOperand).length;
            progress = Math.min(len * 5, 100);
            document.getElementById('progress').style.width = progress + '%';
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number;
            } else {
                currentOperand += number;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                calculate();
            }
            operation = op;
            previousOperand = currentOperand + ' ' + getDisplayOperator(op);
            currentOperand = '0';
            updateDisplay();
        }

        function getDisplayOperator(op) {
            const operators = { '+': '+', '-': '−', '*': '×', '/': '÷', '%': '%' };
            return operators[op] || op;
        }

        function calculate() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            
            if (isNaN(prev) || isNaN(current)) return;
            
            switch (operation) {
                case '+': computation = prev + current; break;
                case '-': computation = prev - current; break;
                case '*': computation = prev * current; break;
                case '/': 
                    if (current === 0) {
                        triggerError();
                        return;
                    }
                    computation = prev / current; 
                    break;
                case '%': computation = prev % current; break;
                default: return;
            }
            
            currentOperand = computation.toString();
            operation = undefined;
            previousOperand = '';
            progress = 100;
            updateDisplay();
            
            setTimeout(() => {
                progress = 0;
                updateDisplay();
            }, 1000);
        }

        function clearAll() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            progress = 0;
            updateDisplay();
        }

        function deleteLast() {
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '' || currentOperand === '-') {
                currentOperand = '0';
            }
            updateDisplay();
        }

        function triggerError() {
            currentOperand = "Error";
            previousOperand = "";
            updateDisplay();
            const calc = document.getElementById('calc');
            calc.classList.add('shake');
            setTimeout(() => calc.classList.remove('shake'), 500);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '+' || e.key === '-') appendOperator(e.key);
            if (e.key === '*') appendOperator('*');
            if (e.key === '/') appendOperator('/');
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Escape') clearAll();
            if (e.key === 'Backspace') deleteLast();
        });
    </script>
</body>
</html>
